apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-orders-api
  labels:
    app: sample-orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-orders-api
  template:
    metadata:
      labels:
        app: sample-orders-api
    spec:
      containers:
        - name: sample-orders-api
          image: ghcr.io/example-org/sample-orders-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: development
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
