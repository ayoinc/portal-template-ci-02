apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-nextjs-app
  labels:
    app: sample-nextjs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-nextjs-app
  template:
    metadata:
      labels:
        app: sample-nextjs-app
    spec:
      containers:
        - name: sample-nextjs-app
          image: ghcr.io/example-org/sample-nextjs-app:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
